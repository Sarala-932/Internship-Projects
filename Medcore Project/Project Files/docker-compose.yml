version: '3.8'

services:
  backend:
    build: ./Backend
    container_name: medcore_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env

  nginx:
    image: nginx:alpine
    container_name: medcore_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
